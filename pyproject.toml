[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-visit-tracker"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
service-tracker = "service_tracker.cli:main"

[tool.setuptools.dynamic]
version = {attr = "service_tracker.__version__"}

[tool.setuptools.packages.find]
include = ["service_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]